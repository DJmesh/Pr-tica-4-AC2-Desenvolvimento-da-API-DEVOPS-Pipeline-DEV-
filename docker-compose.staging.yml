version: "3.8"

services:
  # Banco de dados para o ambiente STAGING
  database:
    image: postgres:15
    container_name: subscription-db-staging
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscription_staging
      POSTGRES_USER: postgres
    volumes:
      - db-volume:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicação Spring Boot (subscription-service) em STAGING
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: subscription-service:latest
    container_name: subscription-api-staging
    depends_on:
      database:
        condition: service_healthy
      mqtt:
        condition: service_started
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - default
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: subscription_staging
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: staging

      # Variáveis de ambiente para futura integração com mensageria
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Broker MQTT (Eclipse Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"   # Porta padrão MQTT
    networks:
      - default

  # RabbitMQ com painel de gerenciamento
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"   # Porta AMQP
      - "15672:15672" # Painel web de management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - default

  # Zookeeper para o Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - default

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-broker
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-broker:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  db-volume:
